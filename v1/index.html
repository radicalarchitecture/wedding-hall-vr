<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0f0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Radical Architecture — Wedding Hall · 360° / VR</title>
<meta name="description" content="Immersive 360° and VR walkthrough of the wedding hall interior by Radical Architecture, Pondicherry.">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>

<div id="loader">
  <div class="lmark">RA</div>
  <div class="ltitle">Radical Architecture</div>
  <div class="lsub">Wedding Hall · Immersive Presentation</div>
  <div class="lbar"><i id="lprog"></i></div>
</div>

<header id="title">
  <div class="brand">RADICAL ARCHITECTURE</div>
  <h1>Wedding Hall</h1>
  <div class="sub">Pondicherry · 360° interior presentation</div>
</header>

<canvas id="minimap" width="240" height="96" title="Plan — tap to jump"></canvas>

<div id="hint">☝ Drag to look around · pinch to zoom · tap gold rings to walk</div>
<div id="toast"></div>

<nav id="views"></nav>

<div id="bar">
  <button id="btnMotion" class="tb" aria-label="Motion (gyroscope)"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M3 8c-1.3 2.5-1.3 5.5 0 8M21 8c1.3 2.5 1.3 5.5 0 8"/></svg><span>Motion</span></button>
  <button id="btnAuto" class="tb" aria-label="Auto tour"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z" fill="currentColor"/></svg><span>Tour</span></button>
  <button id="btnVR" class="vr" aria-label="Enter VR headset mode"><svg viewBox="0 0 48 30"><path d="M6 3h36a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H32.5a3 3 0 0 1-2.6-1.6l-3-5.6a3.2 3.2 0 0 0-5.8 0l-3 5.6A3 3 0 0 1 15.5 25H6a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4z"/><circle cx="14" cy="13" r="4.2"/><circle cx="34" cy="13" r="4.2"/></svg><span>VR</span></button>
  <a id="btnPano" class="tb" href="pano/wedding-hall-360-8k.jpg" download="RadicalArchitecture-WeddingHall-360-8K.jpg" aria-label="Download 360 panorama"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg><span>360 JPG</span></a>
  <button id="btnFS" class="tb" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Full</span></button>
</div>

<!-- VR overlay -->
<div id="vr">
  <div class="divider"></div>
  <div class="reticle l"><svg viewBox="0 0 40 40"><circle class="rb" cx="20" cy="20" r="14"/><circle class="rp" cx="20" cy="20" r="14"/><circle cx="20" cy="20" r="2.4" class="rd"/></svg></div>
  <div class="reticle r"><svg viewBox="0 0 40 40"><circle class="rb" cx="20" cy="20" r="14"/><circle class="rp" cx="20" cy="20" r="14"/><circle cx="20" cy="20" r="2.4" class="rd"/></svg></div>
  <div class="vrtoast l"></div><div class="vrtoast r"></div>
</div>
<div id="rotate"><div class="phone"></div><p>Rotate your phone to landscape<br><small>then place it in the VR viewer</small></p><button id="rotCancel">Exit VR</button></div>

<script type="module" src="app.js"></script>
</body>
</html>
